name: Build IP lists

on:
  push:
    paths-ignore:
      - ".gitignore"
      - "LICENSE*"
      - "*.md"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Checkout geo lists
      uses: actions/checkout@v3
      with:
        ref: main
        path: geo-src

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'

    - name: Tidy go modules
      run: go mod tidy

    - name: Copy lst files
      run: |
        mkdir -p geo
        rm -rf geo/*
        cp geo-src/geo/geoip/*.lst geo/

    - name: Install geoip tool
      run: go install github.com/Loyalsoldier/geoip@latest

    - name: Build dat
      run: geoip convert

    - name: Rename dat
      run: |
        mkdir -p release
        mv release/geoip.dat release/geoipinfo.dat

    - name: Check if geoipinfo.dat changed
      id: diff
      run: |
        if git diff --quiet release/geoipinfo.dat; then
          echo "changed=false" >> $GITHUB_OUTPUT
        else
          echo "changed=true" >> $GITHUB_OUTPUT
        fi

    - name: Generate hash
      if: steps.diff.outputs.changed == 'true'
      run: |
        sha256sum release/geoipinfo.dat > release/geoipinfo.dat.sha256sum

    - name: Commit and push
      if: steps.diff.outputs.changed == 'true'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config user.name "IP geoipinfo.dat Generator"
        git config user.email "noreply@myrepo.com"
        git add geo/* release/*
        git commit -m "Update country IP lists"
        git push https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git

    - name: Create tag
      if: steps.diff.outputs.changed == 'true'
      id: tag
      run: |
        TAG="geoip-$(date +'%Y.%m.%d-%H%M')"
        echo "tag=$TAG" >> $GITHUB_OUTPUT
        git pull --ff-only
        git tag "$TAG"
        git push origin "$TAG"

    - name: Release and upload assets
      if: steps.diff.outputs.changed == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create ${{ steps.tag.outputs.tag }} \
          -t "GeoIP IPinfo update ${{ steps.tag.outputs.tag }}" \
          -n "Auto-generated GeoIP IPinfo database update" \
          release/geoipinfo.dat \
          release/geoipinfo.dat.sha256sum
