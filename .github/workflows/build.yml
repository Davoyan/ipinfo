name: Build RU&BY geoipinfo.dat

on:
  push:
    branches:
      - main
    paths-ignore:
      - ".gitignore"
      - "LICENSE*"
      - "*.md"
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repo (this tree)
      uses: actions/checkout@v3
      with:
        persist-credentials: false

    - name: Checkout geo lists from main
      uses: actions/checkout@v3
      with:
        ref: main
        path: geo-src
        
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'
        
    - name: Tidy go modules
      run: go mod tidy

    - name: Copy lst files
      run: |
        mkdir -p geo
        rm -rf geo/*
        cp geo-src/geo/geoip/ru.lst geo/ru.lst
        cp geo-src/geo/geoip/by.lst geo/by.lst
        
    - name: Install geoip tool
      run: |
        go install github.com/Loyalsoldier/geoip@latest
        
    - name: Build dat
      run: |
        geoip convert
        
    - name: Rename
      run: |
        mkdir -p release
        mv release/geoip.dat release/geoipinfo.dat
        sha256sum release/geoipinfo.dat > release/geoipinfo.dat.sha256sum
       
    - name: Generate hash
      run: |
        sha256sum release/geoipinfo.dat > release/geoipinfo.dat.sha256sum
          
    - name: Commit and push generated files
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config user.name "IP geoipinfo.dat Generator"
        git config user.email "noreply@myrepo.com"
        git add geo/*
        git add release/*
        git commit -m "Update country IP lists" || echo "No changes"
        git push https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
